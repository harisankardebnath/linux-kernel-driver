name: VANTEX diagnostic ARM64 family matrix — standalone bundles

on:
  push:
    branches: [main]
    paths:
      - 'driver/**'
      - 'driver.h'
      - 'scripts/**'
      - 'vantex.sh'
      - '.github/workflows/vantex-kernel-matrix.yml'
  workflow_dispatch:
    inputs:
      targets:
        description: "Kernel families to build"
        required: true
        default: "4.14,4.19,5.4,5.10,5.15,6.1"
        type: string

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - id: matrix
        env:
          TARGETS: ${{ inputs.targets || '4.14,4.19,5.4,5.10,5.15,6.1' }}
        run: |
          python3 - <<'PY'
          import json, os
          allowed = ["4.14", "4.19", "5.4", "5.10", "5.15", "6.1"]
          requested = [x.strip() for x in os.environ["TARGETS"].split(",") if x.strip()]
          invalid = sorted(set(requested) - set(allowed))
          if invalid:
              raise SystemExit("Unsupported target(s): " + ", ".join(invalid))
          if not requested:
              raise SystemExit("Select at least one kernel family")
          matrix = [{"version": v, "branch": "linux-" + v + ".y"} for v in requested]
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("value=" + json.dumps({"include": matrix}, separators=(",", ":")) + "\n")
          PY

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install ARM64 build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex g++ gcc-aarch64-linux-gnu git kmod libelf-dev libssl-dev make python3 file
          aarch64-linux-gnu-gcc --version

      - name: Validate VANTEX userspace header
        run: |
          set -euo pipefail
          printf '#include "driver.h"\nint main() { vantex_driver client; return client.is_open() ? 0 : 0; }\n' > /tmp/vantex-header-check.cpp
          g++ -std=c++17 -Wall -Wextra -Werror -I"$GITHUB_WORKSPACE" -fsyntax-only /tmp/vantex-header-check.cpp

      - name: Fetch Linux stable source
        env:
          BRANCH: ${{ matrix.branch }}
        run: git clone --depth=1 --single-branch --branch "$BRANCH" https://github.com/gregkh/linux.git kernel

      - name: Prepare ARM64 build tree
        run: |
          set -euo pipefail
          mkdir -p out
          make -C kernel O="$GITHUB_WORKSPACE/out" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- defconfig
          make -C kernel O="$GITHUB_WORKSPACE/out" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          make -C kernel O="$GITHUB_WORKSPACE/out" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- modules_prepare
          make -s -C kernel O="$GITHUB_WORKSPACE/out" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- kernelrelease | tee kernelrelease.txt
          test -s out/.config
          grep -q '^CONFIG_ARM64=y' out/.config

      - name: Build VANTEX diagnostic module
        run: |
          set -euo pipefail
          make -C kernel O="$GITHUB_WORKSPACE/out" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- M="$GITHUB_WORKSPACE/driver" CONFIG_REVERSE_EXE=m modules
          test -s driver/reverse_exe.ko
          file driver/reverse_exe.ko | grep -q "ELF 64-bit LSB relocatable, ARM aarch64"

      - name: Stage module and build metadata
        env:
          VERSION: ${{ matrix.version }}
        run: |
          set -euo pipefail
          DEST="$GITHUB_WORKSPACE/artifacts/linux-$VERSION"
          mkdir -p "$DEST"
          cp driver/reverse_exe.ko "$DEST/vantex-$VERSION-arm64.ko"
          cp kernelrelease.txt "$DEST/"
          printf '%s\n' "$VERSION" > "$DEST/kernel-family.txt"
          cp out/.config "$DEST/kernel.config"
          git -C kernel rev-parse HEAD > "$DEST/kernel-commit.txt"
          modinfo "$DEST/vantex-$VERSION-arm64.ko" > "$DEST/modinfo.txt"
          sha256sum "$DEST/vantex-$VERSION-arm64.ko" > "$DEST/SHA256SUMS"

      - uses: actions/upload-artifact@v4
        with:
          name: vantex-linux-${{ matrix.version }}-arm64
          path: artifacts/linux-${{ matrix.version }}/
          if-no-files-found: error
          retention-days: 14

  package:
    needs: [prepare, build]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Download successful kernel build inputs
        uses: actions/download-artifact@v4
        with:
          pattern: vantex-linux-*-arm64
          path: collected
          merge-multiple: false

      - name: Generate and validate one self-contained shell file per module
        run: |
          set -euo pipefail
          chmod +x scripts/make-embedded-loader.sh
          scripts/make-embedded-loader.sh collected loaders
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          bundles = sorted(Path("loaders").glob("vantex-linux-*-arm64.sh"))
          if not bundles:
              raise SystemExit("No standalone loader bundles were generated")
          for bundle in bundles:
              data = bundle.read_bytes()
              match = re.search(rb"(?m)^PAYLOAD_OFFSET=([0-9]{12})$", data)
              if not match:
                  raise SystemExit(f"{bundle}: missing fixed-width payload offset")
              offset = int(match.group(1))
              if offset <= match.end() or offset >= len(data):
                  raise SystemExit(f"{bundle}: invalid payload offset {offset}")
              prefix, payload = data[:offset], data[offset:]
              if not prefix.endswith(b"exec /system/bin/true\n"):
                  raise SystemExit(f"{bundle}: shell prefix must end with exec terminator")
              subprocess.run(["sh", "-n"], input=prefix, check=True)
              if not payload.startswith(b"\x7fELF"):
                  raise SystemExit(f"{bundle}: appended payload is not ELF")
              temp = Path("/tmp/vantex-module-check.ko")
              temp.write_bytes(payload)
              info = subprocess.check_output(["file", str(temp)], text=True)
              if "ELF 64-bit LSB relocatable, ARM aarch64" not in info:
                  raise SystemExit(f"{bundle}: unexpected payload type: {info.strip()}")
              temp.unlink()
              print(f"PASS {bundle}: shell syntax + raw ARM64 ELF payload")
          PY
          test -n "$(find loaders -maxdepth 1 -type f -name 'vantex-linux-*-arm64.sh' -print -quit)"
          echo "Standalone shell bundles passed syntax and embedded-ELF checks."

      - name: Publish standalone VANTEX installers
        uses: actions/upload-artifact@v4
        with:
          name: VANTEX-standalone-SH-installers
          path: loaders/vantex-linux-*-arm64.sh
          if-no-files-found: error
          retention-days: 30
