name: Build Android 12 ARM64 module + reverse_exe

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "5.10"
            branch: "common-android12-5.10"
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential clang-14 lld-14 llvm-14 gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu flex git kmod libelf-dev libssl-dev python3 rsync
          # Linux 5.10 Kconfig probes the unversioned linker name even when LLVM=-14 is used.
          sudo ln -sf /usr/bin/ld.lld-14 /usr/local/bin/ld.lld
          sudo ln -sf /usr/bin/clang-14 /usr/local/bin/clang
          sudo ln -sf /usr/bin/llvm-ar-14 /usr/local/bin/llvm-ar
          sudo ln -sf /usr/bin/llvm-objdump-14 /usr/local/bin/llvm-objdump
          sudo ln -sf /usr/bin/llvm-nm-14 /usr/local/bin/llvm-nm
          sudo ln -sf /usr/bin/llvm-objcopy-14 /usr/local/bin/llvm-objcopy
          # Expose every installed LLVM 14 utility under its unversioned name.
          # Kernel build rules call tools such as llvm-strip directly.
          for tool in /usr/bin/llvm-*-14; do
            [ -x "$tool" ] || continue
            name="$(basename "$tool" -14)"
            sudo ln -sf "$tool" "/usr/local/bin/$name"
          done
          command -v llvm-objdump
          command -v llvm-nm
          command -v llvm-objcopy
          command -v ld.lld
          ld.lld --version
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Fetch Android 12 Common Kernel 5.10
        env:
          BRANCH: ${{ matrix.branch }}
        run: |
          mkdir -p "sources/${{ matrix.version }}"
          cd "sources/${{ matrix.version }}"
          repo init -u https://android.googlesource.com/kernel/manifest -b "$BRANCH"
          repo sync -c --no-tags -j2

      - name: Integrate reverse_exe
        run: bash ./scripts/integrate-driver.sh "$GITHUB_WORKSPACE/sources/${{ matrix.version }}"

      - name: Configure Android 12 ARM64 kernel
        run: |
          set -euo pipefail
          cd "sources/${{ matrix.version }}"
          KOUT="$PWD/out/android12-5.10/common"
          mkdir -p "$KOUT"
          make -C common O="$KOUT" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- LLVM=-14 gki_defconfig
          common/scripts/config --file "$KOUT/.config" -m CONFIG_REVERSE_EXE
          make -C common O="$KOUT" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- LLVM=-14 olddefconfig
          grep -E '^(CONFIG_ARM64=y|CONFIG_REVERSE_EXE=m|CONFIG_MODVERSIONS=)' "$KOUT/.config" || true

      - name: Build kernel modules only (no vmlinux or GKI image)
        run: |
          set -euo pipefail
          cd "sources/${{ matrix.version }}"
          KOUT="$PWD/out/android12-5.10/common"
          set -o pipefail
          make -C common O="$KOUT" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- LLVM=-14 -j2 modules 2>&1 | tee "$GITHUB_WORKSPACE/modules-build.log"
          test -f "$KOUT/drivers/misc/reverse_exe/reverse_exe.ko"

      - name: Collect ONLY reverse_exe.ko
        run: |
          set -euo pipefail
          KOUT="$GITHUB_WORKSPACE/sources/${{ matrix.version }}/out/android12-5.10/common"
          STAGE="$GITHUB_WORKSPACE/module-artifact"
          MODULE="$KOUT/drivers/misc/reverse_exe/reverse_exe.ko"
          test -f "$MODULE"
          mkdir -p "$STAGE"
          RELEASE="$(make -s -C "$GITHUB_WORKSPACE/sources/${{ matrix.version }}/common" O="$KOUT" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- LLVM=-14 kernelrelease)"
          case "$RELEASE" in 5.10.*) ;; *) echo "Unexpected kernel release: $RELEASE" >&2; exit 1;; esac
          cp "$MODULE" "$STAGE/reverse_exe-5.10.ko"
          printf '%s\\n' "$RELEASE" > "$STAGE/kernelrelease.txt"
          git -C "$GITHUB_WORKSPACE/sources/${{ matrix.version }}/common" rev-parse HEAD > "$STAGE/kernel-commit.txt"
          sha256sum "$STAGE/reverse_exe-5.10.ko" > "$STAGE/SHA256SUMS"
          modinfo "$STAGE/reverse_exe-5.10.ko" > "$STAGE/modinfo.txt"

      - name: Upload module only (.ko)
        uses: actions/upload-artifact@v4
        with:
          name: reverse_exe-android12-5.10-module
          path: module-artifact/
          if-no-files-found: error
          retention-days: 14
