name: Build Android GKI + reverse_exe

on:
  workflow_dispatch:
    inputs:
      versions:
        description: "Comma-separated ACK branches: 5.10,5.15,6.1"
        required: true
        default: "5.10,5.15,6.1"
        type: string

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "5.10"
            branch: "common-android13-5.10"
          - version: "5.15"
            branch: "common-android14-5.15"
          - version: "6.1"
            branch: "common-android14-6.1"
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Select requested version
        id: select
        env:
          REQUESTED: ${{ inputs.versions }}
          VERSION: ${{ matrix.version }}
        run: |
          python3 - <<'PY'
          import os
          values = [v.strip() for v in os.environ["REQUESTED"].split(",")]
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("run=" + str(os.environ["VERSION"] in values).lower() + "\n")
          PY
      - name: Install build dependencies
        if: steps.select.outputs.run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git kmod libelf-dev libssl-dev lz4 python3 rsync unzip zip openjdk-17-jdk
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Fetch Android Common Kernel
        if: steps.select.outputs.run == 'true'
        env:
          BRANCH: ${{ matrix.branch }}
        run: |
          mkdir -p "sources/${{ matrix.version }}"
          cd "sources/${{ matrix.version }}"
          repo init -u https://android.googlesource.com/kernel/manifest -b "$BRANCH"
          repo sync -c --no-tags -j2
      - name: Integrate reverse_exe
        if: steps.select.outputs.run == 'true'
        run: ./scripts/integrate-driver.sh "$GITHUB_WORKSPACE/sources/${{ matrix.version }}"
      - name: Build GKI distribution
        if: steps.select.outputs.run == 'true'
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts/${{ matrix.version }}"
          cd "sources/${{ matrix.version }}"
          set -o pipefail
          tools/bazel run //common:kernel_aarch64_dist -- --destdir="$GITHUB_WORKSPACE/artifacts/${{ matrix.version }}" 2>&1 | tee "$GITHUB_WORKSPACE/artifacts/build-${{ matrix.version }}.log"
      - name: Collect reverse_exe module and metadata
        if: always() && steps.select.outputs.run == 'true'
        run: |
          set -euo pipefail
          DEST="$GITHUB_WORKSPACE/artifacts/${{ matrix.version }}"
          mkdir -p "$DEST"
          FOUND=0
          while IFS= read -r -d '' module; do
            release="$(modinfo -F vermagic "$module" | awk '{print $1}')"
            version="$(printf '%s\n' "$release" | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+' || true)"
            if [ -z "$version" ]; then
              echo "Could not parse kernel version from $module (vermagic: $release)" >&2
              continue
            fi
            cp -v "$module" "$DEST/reverse_exe-$version.ko"
            printf '%s\n' "$release" > "$DEST/kernelrelease-$version.txt"
            sha256sum "$DEST/reverse_exe-$version.ko" > "$DEST/SHA256SUMS-$version"
            FOUND=1
          done < <(find "sources/${{ matrix.version }}" -type f -name 'reverse_exe.ko' -print0 2>/dev/null)
          find "sources/${{ matrix.version }}" -type f -name '*.ko' -print > "$DEST/modules-list.txt" || true
          git -C "sources/${{ matrix.version }}/common" rev-parse HEAD > "$DEST/kernel-commit.txt" 2>/dev/null || true
          if [ "$FOUND" -eq 0 ]; then
            echo "No reverse_exe.ko was produced. This workflow did not create a module artifact." >&2
          fi
      - name: Upload artifacts
        if: always() && steps.select.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: reverse_exe-android-gki-${{ matrix.version }}
          path: artifacts/${{ matrix.version }}/
          if-no-files-found: warn
          retention-days: 14
