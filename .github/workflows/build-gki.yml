name: Build Android 12 ARM64 module + reverse_exe

on:
  workflow_dispatch:
    inputs:
      versions:
        description: "Build only reverse_exe-5.10.ko for Android 12 ARM64 Common Kernel 5.10"
        required: true
        default: "5.10"
        type: string

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "5.10"
            branch: "common-android12-5.10"
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Select requested version
        id: select
        env:
          REQUESTED: ${{ inputs.versions }}
          VERSION: ${{ matrix.version }}
        run: |
          python3 - <<'PY'
          import os
          values = [v.strip() for v in os.environ["REQUESTED"].split(",")]
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("run=" + str(os.environ["VERSION"] in values).lower() + "\n")
          PY
      - name: Install build dependencies
        if: steps.select.outputs.run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git kmod libelf-dev libssl-dev lz4 python3 rsync unzip zip openjdk-17-jdk
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Fetch Android 12 Common Kernel 5.10
        if: steps.select.outputs.run == 'true'
        env:
          BRANCH: ${{ matrix.branch }}
        run: |
          mkdir -p "sources/${{ matrix.version }}"
          cd "sources/${{ matrix.version }}"
          repo init -u https://android.googlesource.com/kernel/manifest -b "$BRANCH"
          repo sync -c --no-tags -j2
      - name: Integrate reverse_exe
        if: steps.select.outputs.run == 'true'
        run: bash ./scripts/integrate-driver.sh "$GITHUB_WORKSPACE/sources/${{ matrix.version }}"
      - name: Build Android 12 kernel (module build prerequisite)
        if: steps.select.outputs.run == 'true'
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts/${{ matrix.version }}"
          cd "sources/${{ matrix.version }}"
          set -o pipefail
          BUILD_CONFIG=common/build.config.gki.aarch64 DIST_DIR="$GITHUB_WORKSPACE/artifacts/${{ matrix.version }}" build/build.sh 2>&1 | tee "$GITHUB_WORKSPACE/artifacts/build-${{ matrix.version }}.log"
      - name: Collect ONLY reverse_exe.ko
        if: success() && steps.select.outputs.run == 'true'
        run: |
          set -euo pipefail
          DIST="$GITHUB_WORKSPACE/artifacts/${{ matrix.version }}"
          STAGE="$GITHUB_WORKSPACE/module-artifact"
          mkdir -p "$STAGE"
          MODULE="$(find "$DIST" "sources/${{ matrix.version }}" -type f -name 'reverse_exe.ko' -print -quit 2>/dev/null || true)"
          if [ -z "$MODULE" ]; then
            echo "reverse_exe.ko was not produced by the Android 12 kernel build." >&2
            echo "No GKI image will be published as a substitute." >&2
            exit 1
          fi
          RELEASE="$(modinfo -F vermagic "$MODULE" | awk '{print $1}')"
          VERSION="$(printf '%s\n' "$RELEASE" | grep -oE '^[0-9]+\.[0-9]+' || true)"
          if [ "$VERSION" != "5.10" ]; then
            echo "Wrong kernel family: $RELEASE" >&2
            exit 1
          fi
          cp "$MODULE" "$STAGE/reverse_exe-5.10.ko"
          printf '%s\n' "$RELEASE" > "$STAGE/kernelrelease.txt"
          git -C "sources/${{ matrix.version }}/common" rev-parse HEAD > "$STAGE/kernel-commit.txt" 2>/dev/null || true
          sha256sum "$STAGE/reverse_exe-5.10.ko" > "$STAGE/SHA256SUMS"
          modinfo "$STAGE/reverse_exe-5.10.ko" > "$STAGE/modinfo.txt"
      - name: Upload module only (.ko)
        if: success() && steps.select.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: reverse_exe-android12-5.10-module
          path: module-artifact/
          if-no-files-found: warn
          retention-days: 14
