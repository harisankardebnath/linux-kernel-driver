name: VANTEX embedded diagnostic driver matrix (4.14–6.1)

on:
  push:
    branches: [main]
    paths:
      - 'driver/**'
      - 'scripts/make-embedded-shell-loader.sh'
      - '.github/workflows/vantex-embedded-matrix.yml'
  workflow_dispatch:
    inputs:
      targets:
        description: 'Kernel families to build'
        required: true
        default: '4.14,4.19,5.4,5.10,5.15,6.1'
        type: string

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - id: matrix
        env:
          TARGETS: ${{ inputs.targets || '4.14,4.19,5.4,5.10,5.15,6.1' }}
        run: |
          python3 - <<'PY'
          import json, os
          allowed = ["4.14", "4.19", "5.4", "5.10", "5.15", "6.1"]
          requested = [x.strip() for x in os.environ["TARGETS"].split(",") if x.strip()]
          invalid = sorted(set(requested) - set(allowed))
          if invalid:
              raise SystemExit("Unsupported kernel family: " + ", ".join(invalid))
          if not requested:
              raise SystemExit("Select at least one kernel family")
          matrix = [
              {
                  "version": v,
                  "ref": "v5.10.240" if v == "5.10" else "linux-" + v + ".y"
              }
              for v in requested
          ]
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("value=" + json.dumps({"include": matrix}, separators=(",", ":")) + "\\n")
          PY

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install ARM64 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex g++ gcc-aarch64-linux-gnu git kmod libelf-dev libssl-dev make python3 file

      - name: Fetch Linux stable source
        env:
          KERNEL_REF: ${{ matrix.ref }}
        run: git clone --depth=1 --single-branch --branch "$KERNEL_REF" https://github.com/gregkh/linux.git kernel

      - name: Prepare ARM64 kernel
        run: |
          set -euo pipefail
          mkdir -p out
          make -C kernel O="$GITHUB_WORKSPACE/out" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- defconfig
          make -C kernel O="$GITHUB_WORKSPACE/out" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          make -C kernel O="$GITHUB_WORKSPACE/out" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- modules_prepare
          make -s -C kernel O="$GITHUB_WORKSPACE/out" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- kernelrelease | tee kernelrelease.txt
          grep -q '^CONFIG_ARM64=y' out/.config

      - name: Build safe VANTEX diagnostic module
        run: |
          set -euo pipefail
          make -C kernel O="$GITHUB_WORKSPACE/out" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- M="$GITHUB_WORKSPACE/driver" CONFIG_REVERSE_EXE=m modules
          test -s driver/reverse_exe.ko
          file driver/reverse_exe.ko | grep -q 'ELF 64-bit LSB relocatable, ARM aarch64'

      - name: Stage module and metadata
        env:
          FAMILY: ${{ matrix.version }}
        run: |
          set -euo pipefail
          DEST="$GITHUB_WORKSPACE/artifacts/linux-$FAMILY"
          mkdir -p "$DEST"
          cp driver/reverse_exe.ko "$DEST/vantex-$FAMILY-arm64.ko"
          cp kernelrelease.txt "$DEST/"
          printf '%s\\n' "$FAMILY" > "$DEST/kernel-family.txt"
          git -C kernel rev-parse HEAD > "$DEST/kernel-commit.txt"
          modinfo "$DEST/vantex-$FAMILY-arm64.ko" > "$DEST/modinfo.txt"
          sha256sum "$DEST/vantex-$FAMILY-arm64.ko" > "$DEST/SHA256SUMS"

      - uses: actions/upload-artifact@v4
        with:
          name: vantex-embedded-input-${{ matrix.version }}-arm64
          path: artifacts/linux-${{ matrix.version }}/
          if-no-files-found: error
          retention-days: 14

  package:
    needs: [prepare, build]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Download successful matrix artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: vantex-embedded-input-*-arm64
          path: collected
          merge-multiple: false

      - name: Generate and validate standalone shell packages
        run: |
          set -euo pipefail
          chmod +x scripts/make-embedded-shell-loader.sh
          scripts/make-embedded-shell-loader.sh collected loaders
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          bundles = sorted(Path("loaders").glob("vantex-linux-*-arm64.sh"))
          if not bundles:
              raise SystemExit("No standalone loaders generated")
          for bundle in bundles:
              data = bundle.read_bytes()
              marker = b"#\\xe7\\xa6\\xbb\\n"
              pos = data.find(marker)
              if pos < 0:
                  raise SystemExit(f"{bundle}: missing #离 payload marker")
              match = re.search(rb"(?m)^PAYLOAD_OFFSET=([0-9]{12})$", data)
              if not match:
                  raise SystemExit(f"{bundle}: missing payload offset")
              offset = int(match.group(1))
              if offset != pos + len(marker):
                  raise SystemExit(f"{bundle}: incorrect payload offset")
              prefix, payload = data[:offset], data[offset:]
              subprocess.run(["sh", "-n"], input=prefix.split(marker)[0], check=True)
              if not payload.startswith(b"\\x7fELF"):
                  raise SystemExit(f"{bundle}: embedded payload is not ELF")
              extracted = subprocess.check_output(["tail", "-c", f"+{offset + 1}", str(bundle)])
              if extracted != payload:
                  raise SystemExit(f"{bundle}: byte-exact extraction test failed")
              print(f"PASS {bundle}: shell syntax, marker, raw ELF and extraction")
          PY

      - name: Publish standalone VANTEX shell loaders
        uses: actions/upload-artifact@v4
        with:
          name: VANTEX-standalone-embedded-SH-loaders
          path: loaders/vantex-linux-*-arm64.sh
          if-no-files-found: error
          retention-days: 30
