# ARM64 Linux 5.10.x target. This is not a universal-binary guarantee.
architecture: arm64
target_family: "5.10"
target_range: "5.10.x"
build_mode: one_distinct_ko_per_exact_device_kernel_build
filename: "reverse_exe-5.10.ko"
status: source_target_not_cross_vendor_certified
vendor_families_intended:
  - Qualcomm
  - MediaTek
  - Samsung_Exynos
  - Other_ARM64_5.10_vendor_kernels
required_inputs_per_device_build:
  - exact_vendor_kernel_source
  - exact_prepared_kernel_output_tree
  - exact_kernel_config
  - generated_headers
  - Module.symvers_when_CONFIG_MODVERSIONS
  - matching_toolchain_and_build_flags
  - matching_GKI_KMI_and_module_signing_policy_when_applicable
artifact_directory: "artifacts/per-kernel/<full-kernelrelease>-arm64/"
ci_baseline:
  - "Android Common Kernel 5.10"
not_certified_until_device_build_and_load_test:
  - "All third-party OEM 5.10.x kernels"
  - "All vendor configurations and firmware revisions"
