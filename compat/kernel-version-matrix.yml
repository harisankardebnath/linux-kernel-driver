# Intended compatibility target; not every kernel has been build/load tested.
architecture: arm64
minimum_target: "4.4"
maximum_target: "6.1"
range: "4.4.x through 6.1.x inclusive"
build_mode: one_distinct_ko_per_exact_kernel_build
version_families:
  - "4.4"
  - "4.9"
  - "4.14"
  - "4.19"
  - "5.4"
  - "5.10"
  - "5.15"
  - "6.1"
status: source_compatibility_target_not_fully_tested
required_inputs_per_build:
  - exact_kernel_source_and_output_tree
  - exact_kernel_config
  - generated_headers
  - Module.symvers_when_CONFIG_MODVERSIONS
  - matching_toolchain
filename_pattern: "reverse_exe-<major>.<minor>.ko"
examples:
  - "reverse_exe-4.4.ko"
  - "reverse_exe-4.9.ko"
  - "reverse_exe-4.14.ko"
  - "reverse_exe-4.19.ko"
  - "reverse_exe-5.4.ko"
  - "reverse_exe-5.10.ko"
  - "reverse_exe-5.15.ko"
  - "reverse_exe-6.1.ko"
artifact_directory: "artifacts/per-kernel/<full-kernelrelease>-arm64/"
ci_coverage:
  - "common-android13-5.10"
  - "common-android14-5.15"
  - "common-android14-6.1"
not_covered_by_current_ci:
  - "4.4"
  - "4.9"
  - "4.14"
  - "4.19"
  - "5.4"
